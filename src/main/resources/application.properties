spring.application.name=manifest-pdf-service
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true

# Never expose this folder as Spring static resources or through Nginx.
manifest.storage.path=${MANIFEST_STORAGE_PATH:./storage}
# The URL generated in the JSON response. Configure domain/IP + https in production.
manifest.public-base-url=${MANIFEST_PUBLIC_BASE_URL:http://localhost:8080}
manifest.access.zone=${MANIFEST_ACCESS_ZONE:Asia/Jakarta}
# Correlation ID from CorrelationIdFilter in every log line.
logging.pattern.level=%5p [%X{correlationId:-}]

# HTTP Basic Authentication (Spring Security). Credentials have no default: startup fails when unset.
# The password is configured as a BCrypt hash, never in plaintext.
asdp.security.basic-auth.enabled=${ASDP_BASIC_AUTH_ENABLED:true}
asdp.security.basic-auth.realm=${ASDP_BASIC_AUTH_REALM:asdp-internal-api}
asdp.security.basic-auth.bcrypt-strength=12
# Date-password PDF pages are opened in a browser without Basic Auth.
asdp.security.basic-auth.public-paths=/api/v1/manifests/files/**
asdp.security.basic-auth.users[0].username=${MANIFEST_API_USERNAME}
asdp.security.basic-auth.users[0].password-hash=${MANIFEST_API_PASSWORD_HASH}
asdp.security.basic-auth.users[0].authorities=${MANIFEST_API_AUTHORITIES}
asdp.security.basic-auth.users[0].enabled=${MANIFEST_API_ENABLED:true}

# Database for the dock_ship check. No default: startup fails when unset.
spring.datasource.url=${MANIFEST_DB_URL}
spring.datasource.username=${MANIFEST_DB_USERNAME}
spring.datasource.password=${MANIFEST_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=5000
# Read-only JPA: never create or alter tables. Fixed dialect and no metadata lookup at boot,
# so the service still starts (and generate-pdf still works) while the database is down.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.query.timeout=10000
