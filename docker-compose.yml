services:
  manifest-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    image: manifest-pdf-service:1.1.0
    container_name: manifest-pdf-service
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70.0 -Duser.timezone=Asia/Jakarta -Dfile.encoding=UTF-8}"
      MANIFEST_STORAGE_PATH: /app/storage
      MANIFEST_PUBLIC_BASE_URL: "${APP_PUBLIC_BASE_URL:-http://localhost:8080}"
      MANIFEST_ACCESS_ZONE: "${MANIFEST_ACCESS_ZONE:-Asia/Jakarta}"
      MANIFEST_API_USERNAME: "${MANIFEST_API_USERNAME:?isi MANIFEST_API_USERNAME di .env}"
      MANIFEST_API_PASSWORD_HASH: "${MANIFEST_API_PASSWORD_HASH:?isi MANIFEST_API_PASSWORD_HASH (hash BCrypt) di .env}"
      MANIFEST_API_AUTHORITIES: "${MANIFEST_API_AUTHORITIES:?isi MANIFEST_API_AUTHORITIES di .env}"
      MANIFEST_API_ENABLED: "${MANIFEST_API_ENABLED:-true}"
      ASDP_BASIC_AUTH_ENABLED: "${ASDP_BASIC_AUTH_ENABLED:-true}"
      ASDP_BASIC_AUTH_REALM: "${ASDP_BASIC_AUTH_REALM:-asdp-internal-api}"
      MANIFEST_DB_URL: "${MANIFEST_DB_URL:?isi MANIFEST_DB_URL di .env}"
      MANIFEST_DB_USERNAME: "${MANIFEST_DB_USERNAME:?isi MANIFEST_DB_USERNAME di .env}"
      MANIFEST_DB_PASSWORD: "${MANIFEST_DB_PASSWORD:?isi MANIFEST_DB_PASSWORD di .env}"
    volumes:
      # Persist on host even after docker compose down/recreate.
      - ./storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
